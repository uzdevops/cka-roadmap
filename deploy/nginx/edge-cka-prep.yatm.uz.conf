# cka-prep.yatm.uz  ->  http://192.168.121.52
# CKA Prep o'quv platformasi. TLS shu yerda tugaydi. App serverda nginx 80-portda
# turadi va /api/v1/ hamda /docs ni FastAPI'ga, qolganini Next.js'ga uzatadi -
# ya'ni yo'l bo'yicha ajratish o'sha yerda, bu yerda emas.
#
# App server mijoz IP'sini X-Forwarded-For dan emas, proxy_params.conf qo'yadigan
# X-Real-IP dan oladi: uvicorn XFF ning eng chap qiymatini o'qiydi, uni esa
# brauzer o'zi yuborishi mumkin. X-Real-IP ni bu yerda $remote_addr bilan qayta
# yozamiz, shuning uchun uni soxtalashtirib bo'lmaydi.
#
# Platforma yopiq: login'siz hech bir sahifa ko'rinmaydi (Next.js middleware) va
# API anonim so'rovni rad etadi. Adminka /admin da - unga alohida location kerak
# emas, chunki bu o'sha Next.js ilovasining yo'li: /admin ni ochgan odam
# /{til}/admin ga o'tkaziladi, admin roli esa serverda qayta tekshiriladi.
# Ichki tarmoq bilan cheklamoqchi bo'lsangiz, quyidagini qo'shing:
#   location /admin { allow 192.168.0.0/16; deny all; proxy_pass http://192.168.121.52;
#                     include /etc/nginx/includes/proxy_params.conf; }

server {
    listen 80;
    server_name cka-prep.yatm.uz;

    access_log /var/log/nginx/cka-prep.yatm.uz.access.log json_combined;
    error_log  /var/log/nginx/cka-prep.yatm.uz.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cka-prep.yatm.uz;

    ssl_certificate     /etc/letsencrypt/live/cka-prep.yatm.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cka-prep.yatm.uz/privkey.pem;
    include /etc/nginx/includes/ssl_params.conf;

    access_log /var/log/nginx/cka-prep.yatm.uz.access.log json_combined;
    error_log  /var/log/nginx/cka-prep.yatm.uz.error.log warn;

    location / {
        proxy_pass http://192.168.121.52;
        include /etc/nginx/includes/proxy_params.conf;
    }
}
