# CKA Prep - plain HTTP on port 80, no certificate here.
#
# This is the config to use when TLS terminates somewhere else: a separate nginx
# holds the certificate for cka-prep.yatm.uz on 443 and proxies to this host on
# 80. It is also what you want before DNS has moved, since it needs no cert.
#
#   sudo cp deploy/nginx/cka-prep.yatm.uz.http-only.conf \
#           /etc/nginx/conf.d/zz-cka-prep.yatm.uz.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The zz- prefix matters on a box whose nginx uses conf.d/*.conf: that directory
# is included alphabetically and the FIRST server block on a listen address
# becomes the default for unmatched Host headers. Sorting last leaves whatever
# was already the default in place.
#
# What the upstream terminator must send:
#
#   proxy_set_header Host              $host;         # cka-prep.yatm.uz
#   proxy_set_header X-Real-IP         $remote_addr;  # the true peer
#   proxy_set_header X-Forwarded-Proto $scheme;       # https
#
# Note it is X-Real-IP, not X-Forwarded-For, that this config trusts for the
# client address. Verified on this stack: uvicorn 0.34 reads the LEFTMOST
# X-Forwarded-For entry, and that entry is whatever the browser sent - a client
# can put anything there and defeat the API's per-IP rate limiting. X-Real-IP is
# safe because the terminator overwrites it with the connection's real peer.

upstream cka_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream cka_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# TLS ends upstream, so $scheme is always "http" here and hardcoding it would
# tell the backend the request was insecure - which makes every framework-issued
# redirect come back as http://. Pass the proxy's value through when there is
# one, and fall back to $scheme for a direct request.
map $http_x_forwarded_proto $cka_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The client address to hand the backend. X-Real-IP is set by the terminator from
# the real peer and cannot be forged; X-Forwarded-For can, and uvicorn reads its
# leftmost entry. Falls back to the peer for a request that did not come through
# a proxy at all.
map $http_x_real_ip $cka_client_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    # The IP is listed too, so the stack stays reachable for testing without
    # going through the terminator.
    server_name cka-prep.yatm.uz 192.168.121.52;

    client_max_body_size 2m;

    access_log /var/log/nginx/cka-prep.access.log;
    error_log  /var/log/nginx/cka-prep.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $cka_client_ip;
    # Replaces rather than appends: uvicorn reads the leftmost entry, so anything
    # the browser put here must not survive.
    proxy_set_header X-Forwarded-For   $cka_client_ip;
    proxy_set_header X-Forwarded-Proto $cka_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    # No HTTP->HTTPS redirect on purpose. This server only ever receives plain
    # HTTP from the terminator; redirecting here would bounce that request back
    # out to 443 and loop.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Only needed if this host ever answers ACME challenges itself.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Only /api/v1/ - Next.js owns /api/preview.
    location /api/v1/ {
        proxy_pass http://cka_backend;
    }

    location = /openapi.json { proxy_pass http://cka_backend; }
    location /docs           { proxy_pass http://cka_backend; }
    location /redoc          { proxy_pass http://cka_backend; }

    location /_next/static/ {
        proxy_pass http://cka_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cka_frontend;
    }
}
