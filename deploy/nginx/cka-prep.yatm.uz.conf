# nginx site for cka-prep.yatm.uz
#
#   sudo cp deploy/nginx/cka-prep.yatm.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cka-prep.yatm.uz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# One host, split by path - the same shape as k8s/06-ingress.yaml. Because the
# browser only ever talks to this one origin, CORS never applies and
# NEXT_PUBLIC_API_URL is simply the site URL.

upstream cka_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream cka_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- HTTP: ACME challenge, everything else redirected ------------------------

server {
    listen 80;
    listen [::]:80;
    server_name cka-prep.yatm.uz;

    # Leave this reachable over plain HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1. On older builds (Ubuntu 22.04 ships 1.18) drop this line
    # and write the listen directives as `listen 443 ssl http2;` instead.
    http2 on;
    server_name cka-prep.yatm.uz;

    ssl_certificate     /etc/letsencrypt/live/cka-prep.yatm.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cka-prep.yatm.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Matches the backend's own limit; nothing here uploads files.
    client_max_body_size 2m;

    access_log /var/log/nginx/cka-prep.access.log;
    error_log  /var/log/nginx/cka-prep.error.log;

    # Inherited by every location below. uvicorn runs with --proxy-headers, so
    # X-Forwarded-For is what makes the API's rate limiter see real client IPs
    # instead of counting every request against nginx.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- API ---
    # Only /api/v1/. Do NOT widen this to /api/ - Next.js owns /api/preview,
    # which the admin editor calls for its Markdown preview.
    location /api/v1/ {
        proxy_pass http://cka_backend;
    }

    # OpenAPI docs. Delete these three blocks to keep the API surface private.
    location = /openapi.json { proxy_pass http://cka_backend; }
    location /docs           { proxy_pass http://cka_backend; }
    location /redoc          { proxy_pass http://cka_backend; }

    # --- Next.js ---
    # Build output is content-hashed, so it can be cached hard and forever.
    location /_next/static/ {
        proxy_pass http://cka_frontend;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cka_frontend;
    }
}
