# The only entrypoint for a local run:
#
#     docker compose up
#
# Every variable below has a working default, so no .env file is required.
# Copy .env.example to .env only when you want to override something.

services:
  db:
    image: postgres:16-alpine
    container_name: cka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cka_password}
      POSTGRES_DB: ${POSTGRES_DB:-cka_prep}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [k8s]
    ports:
      # For psql / GUI clients. Set POSTGRES_PORT_HOST if 5432 is already taken
      # on the host, or delete this block - nothing in the stack needs it.
      #
      # On a public server set POSTGRES_BIND=127.0.0.1 (see .env.production.example)
      # or drop this block entirely. The default binds every interface, which on
      # a server means the database is reachable from the internet.
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cka} -d ${POSTGRES_DB:-cka_prep}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Named explicitly so the k8s/ manifests can reference the same image.
    image: ${BACKEND_IMAGE:-cka-prep-backend:latest}
    container_name: cka-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- database ---
      POSTGRES_USER: ${POSTGRES_USER:-cka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cka_password}
      POSTGRES_DB: ${POSTGRES_DB:-cka_prep}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # --- app ---
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production-0123456789abcdef}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # --- optional Google OAuth: leave empty to hide the button ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:8000/api/v1/auth/google/callback}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-http://localhost:3000/auth/callback}
      # --- features ---
      ENFORCE_PHASE_UNLOCK: ${ENFORCE_PHASE_UNLOCK:-false}
      # Off until the Start screen exists in the frontend. The migration
      # backfills an enrolment for anyone with progress, but a brand new
      # account has none - with the gate on and no Start button, that
      # account can reach no content at all. Same arrangement as
      # ENFORCE_PHASE_UNLOCK above.
      ENFORCE_TRACK_START: ${ENFORCE_TRACK_START:-true}
      TRACK_DEFAULT_WEEKS: ${TRACK_DEFAULT_WEEKS:-20}
      # --- Telegram (optional; empty token disables the bot) ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      LINK_TOKEN_TTL_MINUTES: ${LINK_TOKEN_TTL_MINUTES:-15}
      REMINDER_TZ: ${REMINDER_TZ:-Asia/Tashkent}
      REMINDER_HOUR: ${REMINDER_HOUR:-20}
      REMINDER_MINUTE: ${REMINDER_MINUTE:-30}
      SEED_ON_START: ${SEED_ON_START:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # --- demo accounts ---
      # These defaults MUST match backend/app/config.py - a value set here wins
      # over the one in Settings, so a mismatch silently ignores the Python
      # default. tests/test_config_defaults.py fails if they drift.
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-student@demo.local}
      DEMO_STUDENT_USERNAME: ${DEMO_STUDENT_USERNAME:-student}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-DemoPass123!}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.local}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-123}
    networks: [k8s]
    ports:
      # Behind a reverse proxy, set BACKEND_BIND=127.0.0.1 so only nginx on the
      # same host can reach it.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Read-only, and only so tests/test_config_defaults.py can compare the
      # env defaults here against the ones in config.py. Without it that test
      # skips silently inside the container, which is where tests are run.
      - ./docker-compose.yml:/repo/docker-compose.yml:ro
      # Same reason: tests/test_track_config_sync.py compares the frontend's
      # hardcoded routing list against seed_data/tracks.json. Two named files
      # rather than the repo root, so nothing else leaks into the container.
      - ./frontend/src/tracks/config.ts:/repo/frontend/src/tracks/config.ts:ro
      - ./docker-stack.yml:/repo/docker-stack.yml:ro
      - ./k8s/01-config.yaml:/repo/k8s/01-config.yaml:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # uvicorn does not bind until migrations and the seed have finished, so
      # this has to cover the slowest of those, not just process start.
      start_period: 120s

  bot:
    # The SAME image as the backend - see backend/app/bot/__init__.py. A second
    # Dockerfile would mean two definitions of the models and settings.
    image: ${BACKEND_IMAGE:-cka-prep-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cka-bot
    # on-failure, NOT unless-stopped: with no token configured the bot logs why
    # and exits 0, and `unless-stopped` restarts a container whatever its exit
    # code - which turns "the bot is switched off" into a restart loop.
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    # A command means entrypoint.sh skips migrations and the seed, which is what
    # we want: the backend owns those, and two processes racing on them is the
    # failure this avoids.
    command: ["python", "-m", "app.bot"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cka_password}
      POSTGRES_DB: ${POSTGRES_DB:-cka_prep}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Not mirrored from .env on purpose: the DEMO_* seed variables are not
      # passed to this container, so with seeding nominally on, a production
      # Settings() sees the dev-default admin password and refuses to start.
      # The backend owns the seed; this process must say it wants no part of it.
      SEED_ON_START: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production-0123456789abcdef}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      LINK_TOKEN_TTL_MINUTES: ${LINK_TOKEN_TTL_MINUTES:-15}
      REMINDER_TZ: ${REMINDER_TZ:-Asia/Tashkent}
      REMINDER_HOUR: ${REMINDER_HOUR:-20}
      REMINDER_MINUTE: ${REMINDER_MINUTE:-30}
      TRACK_DEFAULT_WEEKS: ${TRACK_DEFAULT_WEEKS:-20}
    networks: [k8s]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time.
        #
        # `-` rather than `:-` on purpose: an UNSET variable still gets the
        # default, but an explicitly EMPTY one is passed through as empty, which
        # makes the browser call /api/v1/... relative to whatever origin served
        # the page. That is what you want behind a reverse proxy - it works over
        # the IP and the domain, http and https, with no rebuild when either
        # changes. Set an absolute URL only if the API lives on another host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    image: ${FRONTEND_IMAGE:-cka-prep-frontend:latest}
    container_name: cka-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Browser-side calls go to the published host port ...
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
      # ... server-side rendering talks to the container directly.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [k8s]
    ports:
      # Behind a reverse proxy, set FRONTEND_BIND=127.0.0.1.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  # One dedicated bridge network for the whole stack. Services reach each other
  # by service name on it (db, backend, frontend) and nothing else on the host
  # shares it.
  k8s:
    name: ${DOCKER_NETWORK:-k8s}
    driver: bridge

volumes:
  pgdata:
    driver: local
