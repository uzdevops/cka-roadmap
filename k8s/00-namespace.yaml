apiVersion: v1
kind: Namespace
metadata:
  name: cka-prep
  labels:
    app.kubernetes.io/part-of: cka-prep
    # Enforce the restricted Pod Security Standard: every workload here runs
    # non-root with no privilege escalation and all capabilities dropped.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
