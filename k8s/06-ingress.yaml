# Single host, path-based split: /api and /docs go to the backend, everything
# else to Next.js. That keeps the browser on one origin, so CORS never applies
# and NEXT_PUBLIC_API_URL is just the site URL.
#
# Assumes ingress-nginx and cert-manager. Adjust the class and annotations for
# your controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cka-prep
  namespace: cka-prep
  labels:
    app.kubernetes.io/part-of: cka-prep
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cka.example.com
      secretName: cka-prep-tls
  rules:
    - host: cka.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cka-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: cka-backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: cka-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cka-frontend
                port:
                  number: 3000
---
# Default-deny, then allow only what the app actually needs. Delete this if
# your CNI does not implement NetworkPolicy - it will silently do nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-only
  namespace: cka-prep
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: migrate
      ports:
        - protocol: TCP
          port: 5432
