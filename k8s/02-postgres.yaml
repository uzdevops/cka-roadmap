# PostgreSQL as a StatefulSet with a PersistentVolumeClaim template.
#
# RECOMMENDATION: for anything beyond a lab cluster, use a managed database
# (RDS, Cloud SQL, Neon) or a real operator (CloudNativePG, Zalando) instead.
# A single-replica StatefulSet gives you durability across Pod restarts but no
# high availability, no automated failover and no point-in-time recovery.
# To switch: delete this file and point POSTGRES_HOST at the managed endpoint.
apiVersion: v1
kind: Service
metadata:
  name: cka-postgres
  namespace: cka-prep
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cka-prep
spec:
  # Headless: the StatefulSet needs stable per-Pod DNS.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cka-postgres
  namespace: cka-prep
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cka-prep
spec:
  serviceName: cka-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: cka-prep
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cka-prep-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cka-prep-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cka-prep-config
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # postgres writes to its data dir
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: standard   # uncomment to pin a class
