apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cka-prep

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-postgres.yaml
  - 03-migrate-job.yaml
  - 04-backend.yaml
  - 05-frontend.yaml
  - 06-ingress.yaml
  - 07-bot.yaml

# `labels` rather than the deprecated `commonLabels`: these land on metadata
# only, never on spec.selector, which is immutable once a Deployment exists.
labels:
  - pairs:
      app.kubernetes.io/part-of: cka-prep
      app.kubernetes.io/managed-by: kustomize

# Point these at your registry, e.g.
#   kustomize edit set image cka-prep-backend=ghcr.io/you/cka-prep-backend:1.0.0
images:
  - name: cka-prep-backend
    newTag: latest
  - name: cka-prep-frontend
    newTag: latest
