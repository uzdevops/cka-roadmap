<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- The brand lemniscate on the accent gradient, matching BrandMark. A file
       here is what Next serves as the tab icon; without one every page load
       logs a 404 for /favicon.ico. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38e1ff"/>
      <stop offset="0.55" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#9a6bff"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#g)"/>
  <path d="M9.6 9.2 C7.1 9.2 6 10.5 6 12 C6 13.5 7.1 14.8 9.6 14.8 C12.6 14.8 13.6 9.2 16.6 9.2"
        stroke="#070a12" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M16.6 14.8 C19.1 14.8 20 13.5 20 12 C20 10.5 19.1 9.2 16.6 9.2"
        stroke="#070a12" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
